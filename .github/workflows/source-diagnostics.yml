name: Diagnose job source access
on:
  workflow_dispatch:
    inputs:
      source:
        description: Sources to check
        type: choice
        options: [all, jooble]
        default: all
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-bot.txt
      - name: Check sources without printing credentials or response bodies
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          DIAGNOSTIC_SOURCE: ${{ inputs.source }}
        run: PYTHONPATH=. python scripts/diagnose_sources.py
